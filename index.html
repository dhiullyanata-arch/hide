<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>Sede de Sangue</title>
<style>

/* =====================================================
   ESTILO GERAL
   A variável --u vale "1 unidade" do jogo (1/600 da altura da tela).
   Assim os menus crescem e diminuem junto com a tela.
   ===================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b1a0f;overflow:hidden;overscroll-behavior:none;
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#caixa{position:relative;overflow:hidden;background:#143018;--u:1px}
#tela{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.oculto{display:none !important}

/* ---------- HUD (vidas, pontos, pausa) ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(var(--u)*12 + env(safe-area-inset-top,0px)) calc(var(--u)*12 + env(safe-area-inset-right,0px)) 0 calc(var(--u)*12 + env(safe-area-inset-left,0px));
  display:flex;align-items:flex-start;justify-content:space-between}
#vidas{display:flex;gap:calc(var(--u)*5);padding-top:calc(var(--u)*6);min-width:calc(var(--u)*96)}
#vidas img{width:calc(var(--u)*28);height:auto;image-rendering:pixelated;filter:drop-shadow(0 calc(var(--u)*2) 0 rgba(0,0,0,.45))}
#vidas img.perdeu{animation:tremer .45s}
#placar{display:flex;flex-direction:column;align-items:center;line-height:1}
#placarLinha{display:flex;align-items:center;gap:calc(var(--u)*8)}
#placarLinha img{height:calc(var(--u)*34);image-rendering:pixelated;filter:drop-shadow(0 calc(var(--u)*2) 0 rgba(0,0,0,.4))}
#pontos{font-size:calc(var(--u)*44);font-weight:900;color:#fff6c8;letter-spacing:1px;
  text-shadow:calc(var(--u)*-2) 0 #3a2108,calc(var(--u)*2) 0 #3a2108,0 calc(var(--u)*-2) #3a2108,0 calc(var(--u)*3) #3a2108,
              calc(var(--u)*-2) calc(var(--u)*3) #3a2108,calc(var(--u)*2) calc(var(--u)*3) #3a2108}
#pontos.pulo{animation:pulo .18s}
#recordeHud{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*14);font-weight:800;color:#ffe9a0;
  text-shadow:0 calc(var(--u)*2) 0 #3a2108,calc(var(--u)*1) 0 #3a2108,calc(var(--u)*-1) 0 #3a2108}
#btnPausa{pointer-events:auto;width:calc(var(--u)*46);height:calc(var(--u)*46);padding:0;cursor:pointer;
  background:#ffd23f;border:calc(var(--u)*3) solid #3a2108;border-radius:calc(var(--u)*8);
  box-shadow:0 calc(var(--u)*4) 0 #c98f10,0 calc(var(--u)*7) 0 #3a2108;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5)}
#btnPausa:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*1) 0 #c98f10,0 calc(var(--u)*4) 0 #3a2108}
#btnPausa i{display:block;width:calc(var(--u)*7);height:calc(var(--u)*20);background:#3a2108}
#btnPausa.tocar i{width:0;height:0;background:none;border-style:solid;border-width:calc(var(--u)*11) 0 calc(var(--u)*11) calc(var(--u)*18);
  border-color:transparent transparent transparent #3a2108;margin-left:calc(var(--u)*4)}
#btnPausa.tocar i + i{display:none}

/* ---------- TELAS (menu, pausa, configurações, fim) ---------- */
.tela{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  pointer-events:none;animation:aparecer .25s ease-out}
.tela.escura{background:radial-gradient(ellipse at center,rgba(8,20,10,.35),rgba(8,20,10,.72))}
.painel{pointer-events:auto;width:min(88%,calc(var(--u)*360));padding:calc(var(--u)*22) calc(var(--u)*20) calc(var(--u)*24);
  display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);text-align:center;color:#fff3cf;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 calc(var(--u)*3),transparent calc(var(--u)*3) calc(var(--u)*34)),
    linear-gradient(#7a4e27,#5c3819);
  border:calc(var(--u)*5) solid #2b1a0c;border-radius:calc(var(--u)*12);
  box-shadow:inset 0 0 0 calc(var(--u)*3) #a8733c,0 calc(var(--u)*8) 0 #1d1108,0 calc(var(--u)*22) calc(var(--u)*30) rgba(0,0,0,.5)}
.painel.livre{background:none;border:none;box-shadow:none}
.titulo{margin:0;font-size:calc(var(--u)*50);line-height:.95;font-weight:900;color:#ffd23f;letter-spacing:1px;text-transform:uppercase;
  text-shadow:calc(var(--u)*-3) 0 #3a2108,calc(var(--u)*3) 0 #3a2108,0 calc(var(--u)*-3) #3a2108,0 calc(var(--u)*3) #3a2108,
              calc(var(--u)*-3) calc(var(--u)*-3) #3a2108,calc(var(--u)*3) calc(var(--u)*-3) #3a2108,
              calc(var(--u)*-3) calc(var(--u)*3) #3a2108,calc(var(--u)*3) calc(var(--u)*3) #3a2108,
              0 calc(var(--u)*8) 0 #3a2108}
.titulo small{display:block;font-size:.62em;color:#fff6c8}
.sub{margin:0;font-size:calc(var(--u)*20);font-weight:900;color:#ffe9a0;text-transform:uppercase;letter-spacing:1px;
  text-shadow:0 calc(var(--u)*2) 0 #2b1a0c}
.btn{pointer-events:auto;width:100%;cursor:pointer;font:inherit;font-size:calc(var(--u)*24);font-weight:900;letter-spacing:1px;text-transform:uppercase;
  color:#3a2108;background:linear-gradient(#ffe36b,#ffc928);padding:calc(var(--u)*12) calc(var(--u)*10);
  border:calc(var(--u)*4) solid #3a2108;border-radius:calc(var(--u)*10);
  box-shadow:inset 0 calc(var(--u)*-5) 0 #e3a50d,0 calc(var(--u)*6) 0 #3a2108}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(calc(var(--u)*4));box-shadow:inset 0 calc(var(--u)*-3) 0 #e3a50d,0 calc(var(--u)*2) 0 #3a2108}
.btn.verde{background:linear-gradient(#8fe36a,#52b83a);box-shadow:inset 0 calc(var(--u)*-5) 0 #3a8f27,0 calc(var(--u)*6) 0 #3a2108}
.btn.verde:active{box-shadow:inset 0 calc(var(--u)*-3) 0 #3a8f27,0 calc(var(--u)*2) 0 #3a2108}
.btn.pequeno{font-size:calc(var(--u)*19)}
#btnConfigMenu,#btnConfigPausa{font-size:calc(var(--u)*21);letter-spacing:0}
.dica{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*8);margin:0;font-size:calc(var(--u)*14);font-weight:800;color:#fff3cf;line-height:1.25}
.dica img{height:calc(var(--u)*30);image-rendering:pixelated}
.recorde{margin:0;font-size:calc(var(--u)*17);font-weight:900;color:#ffe9a0;text-shadow:0 calc(var(--u)*2) 0 #2b1a0c}
.recorde b{color:#fff;font-size:1.25em}
.grande{margin:0;font-size:calc(var(--u)*64);font-weight:900;color:#fff6c8;line-height:1;
  text-shadow:calc(var(--u)*-3) 0 #3a2108,calc(var(--u)*3) 0 #3a2108,0 calc(var(--u)*-3) #3a2108,0 calc(var(--u)*4) #3a2108}
.novo{margin:0;font-size:calc(var(--u)*20);font-weight:900;color:#8fe36a;text-transform:uppercase;letter-spacing:1px;
  text-shadow:0 calc(var(--u)*2) 0 #1d3a10;animation:pulsar .7s infinite alternate}


/* menu inicial: título no alto, informações embaixo (o macaco aparece no meio) */
.tela.menu{flex-direction:column;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*38 + env(safe-area-inset-top,0px)) 0 calc(var(--u)*26 + env(safe-area-inset-bottom,0px))}
.painel.base{gap:calc(var(--u)*8);padding:0}
.painel.base .dica,.painel.base .recorde{text-shadow:0 calc(var(--u)*2) 0 #1d1108,calc(var(--u)*1) 0 #1d1108,calc(var(--u)*-1) 0 #1d1108}
.painel.base .dica{font-size:calc(var(--u)*15)}
.painel.base .dica img{height:calc(var(--u)*26)}
.painel.base{gap:calc(var(--u)*5)}

/* controles deslizantes das configurações */
.ajuste{width:100%;text-align:left}
.ajuste label{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(var(--u)*19);font-weight:900;
  text-transform:uppercase;color:#ffe9a0;text-shadow:0 calc(var(--u)*2) 0 #2b1a0c;margin-bottom:calc(var(--u)*8)}
.ajuste output{font-size:calc(var(--u)*16);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:calc(var(--u)*22);background:transparent;margin:0;cursor:pointer;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:calc(var(--u)*14);background:#2b1a0c;border-radius:calc(var(--u)*7);border:calc(var(--u)*2) solid #1d1108}
input[type=range]::-moz-range-track{height:calc(var(--u)*14);background:#2b1a0c;border-radius:calc(var(--u)*7);border:calc(var(--u)*2) solid #1d1108}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:calc(var(--u)*30);height:calc(var(--u)*30);margin-top:calc(var(--u)*-10);
  background:#ffd23f;border:calc(var(--u)*4) solid #3a2108;border-radius:calc(var(--u)*8);box-shadow:0 calc(var(--u)*3) 0 #c98f10}
input[type=range]::-moz-range-thumb{width:calc(var(--u)*22);height:calc(var(--u)*22);background:#ffd23f;border:calc(var(--u)*4) solid #3a2108;border-radius:calc(var(--u)*8)}

/* animações */
@keyframes aparecer{from{opacity:0;transform:translateY(calc(var(--u)*14))}to{opacity:1;transform:none}}
@keyframes tremer{0%,100%{transform:translateX(0)}20%{transform:translateX(calc(var(--u)*-6))}40%{transform:translateX(calc(var(--u)*6))}60%{transform:translateX(calc(var(--u)*-4))}80%{transform:translateX(calc(var(--u)*4))}}
@keyframes pulo{50%{transform:scale(1.25)}}
@keyframes pulsar{from{transform:scale(1)}to{transform:scale(1.08)}}

/* ---------- tema sombrio (substitui as cores do jogo anterior) ---------- */
html,body{background:#07090d}#caixa{background:#10161c}
.painel{background:linear-gradient(#3b3239,#241d23);color:#e9dccb;box-shadow:inset 0 0 0 calc(var(--u)*3) #5b4a56,0 calc(var(--u)*8) 0 #0c080b,0 calc(var(--u)*22) calc(var(--u)*30) rgba(0,0,0,.6)}
.painel.livre{background:none;box-shadow:none}
.titulo{color:#d12a34}.titulo small{color:#e9dccb}
.sub,.ajuste label,.recorde,.novo{color:#e9b9a8}
.btn{color:#fff4e6;background:linear-gradient(#d9503a,#a82a24);box-shadow:inset 0 calc(var(--u)*-5) 0 #7d1b18,0 calc(var(--u)*6) 0 #2b0d0d;border-color:#2b0d0d}
.btn:active{box-shadow:inset 0 calc(var(--u)*-3) 0 #7d1b18,0 calc(var(--u)*2) 0 #2b0d0d}
.btn.verde{background:linear-gradient(#8aa08c,#5b7060);box-shadow:inset 0 calc(var(--u)*-5) 0 #3f5144,0 calc(var(--u)*6) 0 #1b241d;color:#fff}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
#btnPausa{background:#a82a24;border-color:#2b0d0d;box-shadow:0 calc(var(--u)*4) 0 #7d1b18,0 calc(var(--u)*7) 0 #2b0d0d}
#btnPausa i{background:#fff4e6}#btnPausa.tocar i{background:none;border-left-color:#fff4e6}
input[type=range]::-webkit-slider-thumb{background:#d9503a;box-shadow:0 calc(var(--u)*3) 0 #7d1b18}
/* loja */
.painel.largo{width:min(94%,calc(var(--u)*430));max-height:92%;overflow:auto;pointer-events:auto}
#gradeLoja{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*10);width:100%}
.card{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5);padding:calc(var(--u)*8);background:rgba(0,0,0,.28);
  border:calc(var(--u)*3) solid #14090d;border-radius:calc(var(--u)*8)}
.card canvas{width:calc(var(--u)*90);height:calc(var(--u)*100)}
.card b{font-size:calc(var(--u)*15);text-transform:uppercase}.card small{font-size:calc(var(--u)*13);color:#e9b9a8}
.card .btn{font-size:calc(var(--u)*14);padding:calc(var(--u)*6);border-width:calc(var(--u)*3)}
#aviso{position:absolute;left:calc(var(--u)*12 + env(safe-area-inset-left,0px));top:calc(var(--u)*58 + env(safe-area-inset-top,0px));z-index:5;pointer-events:none;display:flex;align-items:center;gap:calc(var(--u)*8);
  max-width:64%;padding:calc(var(--u)*6) calc(var(--u)*10);background:rgba(10,6,10,.75);border:calc(var(--u)*3) solid #a82a24;border-radius:calc(var(--u)*8);
  font-size:calc(var(--u)*13);font-weight:800;color:#fff4e6;line-height:1.2;animation:aparecer .25s}
#aviso img{height:calc(var(--u)*30);image-rendering:pixelated}
.abas{display:flex;gap:calc(var(--u)*8);width:100%}
</style>
</head>
<body>
<div id="caixa">
  <canvas id="tela"></canvas>
  <div id="hud" class="oculto">
    <div id="vidas"></div>
    <div id="placar">
      <div id="placarLinha"><img data-img="sangue" alt=""><span id="pontos">0</span></div>
      <span id="recordeHud">Moedas: 0</span>
    </div>
    <button id="btnPausa" type="button" aria-label="Pausar"><i></i><i></i></button>
  </div>

  <div id="aviso" class="oculto"><img data-img="kit" alt=""><span id="avisoTxt"></span></div>

  <!-- Lobby: Jogar, Configurações e Loja -->
  <section id="telaMenu" class="tela menu">
    <div class="painel livre topo">
      <h1 class="titulo"><small>Sede de</small>Sangue</h1>
      <div style="height:calc(var(--u)*2)"></div>
      <button id="btnJogar" class="btn verde" type="button">Jogar</button>
      <button id="btnLoja" class="btn" type="button">Loja</button>
      <button id="btnConfigMenu" class="btn" type="button">Configurações</button>
    </div>
    <div class="painel livre base">
      <p class="recorde">Moedas: <b id="moedasMenu">0</b> &nbsp;·&nbsp; Recorde: <b id="recordeMenu">0</b></p>
      <p class="dica">Pegue o sangue sem deixar cair. Fuja do ferro.<br>Celular: arraste o dedo · PC: mouse ou setas ← →</p>
    </div>
  </section>

  <section id="telaLoja" class="tela escura oculto">
    <div class="painel largo">
      <h2 class="sub" style="font-size:calc(var(--u)*26)">Loja</h2>
      <p class="recorde">Moedas: <b id="moedasLoja">0</b></p>
      <div class="abas oculto"><button id="abaBichos" class="btn pequeno verde" type="button">Personagens</button><button id="abaBiomas" class="btn pequeno" type="button">Biomas</button></div>
      <div id="gradeLoja"></div>
      <button id="btnVoltarLoja" class="btn pequeno" type="button">Voltar</button>
    </div>
  </section>

  <section id="telaConfig" class="tela escura oculto">
    <div class="painel">
      <h2 class="sub" style="font-size:calc(var(--u)*23);letter-spacing:0">Configurações</h2>
      <div class="ajuste"><label for="rngVolume">Volume <output id="outVolume">60%</output></label>
        <input id="rngVolume" type="range" min="0" max="100" step="1" value="60"></div>
      <button id="btnVoltarConfig" class="btn pequeno" type="button">Voltar</button>
    </div>
  </section>

  <!-- Pausa: volume e reiniciar -->
  <section id="telaPausa" class="tela escura oculto">
    <div class="painel">
      <h2 class="sub" style="font-size:calc(var(--u)*30)">Pausado</h2>
      <div class="ajuste"><label for="rngVolumePausa">Volume <output id="outVolumePausa">60%</output></label>
        <input id="rngVolumePausa" type="range" min="0" max="100" step="1" value="60"></div>
      <button id="btnContinuar" class="btn verde" type="button">Continuar</button>
      <button id="btnReiniciar" class="btn" type="button">Reiniciar</button>
      <button id="btnMenuPausa" class="btn pequeno" type="button">Menu</button>
    </div>
  </section>

  <section id="telaFim" class="tela escura oculto">
    <div class="painel">
      <h2 class="sub" style="font-size:calc(var(--u)*28)">Fim de jogo</h2>
      <p class="grande" id="fimPontos">0</p>
      <p class="novo oculto" id="fimNovo">Novo recorde!</p>
      <p class="recorde">Moedas ganhas: <b id="fimMoedas">0</b></p>
      <p class="recorde">Recorde: <b id="fimRecorde">0</b></p>
      <button id="btnDeNovo" class="btn verde pequeno" type="button">Jogar de novo</button>
      <button id="btnMenu" class="btn pequeno" type="button">Menu</button>
    </div>
  </section>
</div>
