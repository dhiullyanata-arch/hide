<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pega Caixa</title>
<style>
  /* Página escura, tudo centralizado */
  html, body { margin: 0; height: 100%; background: #222; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Arial, sans-serif; }
  /* O canvas (a "tela" do jogo) se ajusta ao celular, mantendo a proporção 9:16 */
  canvas { background: #cfd3d6; max-width: 100vw; max-height: 88vh;
    aspect-ratio: 9 / 16; touch-action: none; }
  button { margin-top: 8px; padding: 10px 24px; font-size: 18px; font-weight: bold;
    background: #f5b800; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="tela" width="360" height="640"></canvas>
<button id="botao">Recomeçar</button>

<script>
const tela = document.getElementById("tela");
const c = tela.getContext("2d");          // "c" é a caneta que desenha na tela
const L = 360, A = 640;                   // largura e altura do jogo

// Estado do jogo
let caminhao, caixas, pontos, vidas, tempo, estado; // estado: "inicio", "jogando" ou "fim"
let recorde = 0;
try { recorde = Number(localStorage.getItem("pegaCaixaRecorde")) || 0; } catch (e) {}

const teclas = {};                        // guarda quais setas estão apertadas

// Zera tudo e começa uma partida nova
function comecar() {
  caminhao = { x: L / 2 - 40, y: A - 90, w: 80, h: 50 };
  caixas = [];
  pontos = 0;
  vidas = 3;
  tempo = 0;
  estado = "jogando";
}

// ---------- Controles ----------
addEventListener("keydown", e => { teclas[e.key] = true; });
addEventListener("keyup",   e => { teclas[e.key] = false; });

// Arrastar o dedo (ou mouse) move o caminhão
function mover(clientX) {
  if (estado !== "jogando") return;
  const r = tela.getBoundingClientRect();
  const x = (clientX - r.left) * (L / r.width);   // converte para a escala do jogo
  caminhao.x = x - caminhao.w / 2;
}
tela.addEventListener("touchstart", e => { e.preventDefault(); mover(e.touches[0].clientX); }, { passive: false });
tela.addEventListener("touchmove",  e => { e.preventDefault(); mover(e.touches[0].clientX); }, { passive: false });
tela.addEventListener("mousemove", e => { if (e.buttons) mover(e.clientX); });

// Toque na tela inicial começa o jogo
tela.addEventListener("pointerdown", () => { if (estado === "inicio") comecar(); });
document.getElementById("botao").onclick = comecar;

// ---------- Lógica ----------
function atualizar() {
  if (estado !== "jogando") return;
  tempo++;

  // Setas do teclado
  if (teclas["ArrowLeft"])  caminhao.x -= 6;
  if (teclas["ArrowRight"]) caminhao.x += 6;
  caminhao.x = Math.max(0, Math.min(L - caminhao.w, caminhao.x)); // não sai da tela

  // A cada ~1 segundo nasce uma caixa em posição aleatória
  if (tempo % 60 === 0) {
    const tam = 30 + Math.random() * 15;
    caixas.push({ x: Math.random() * (L - tam), y: -tam, w: tam, h: tam, v: 2.5 });
  }

  // Move cada caixa e vê o que aconteceu com ela
  for (let i = caixas.length - 1; i >= 0; i--) {
    const b = caixas[i];
    b.y += b.v;
    const pegou = b.x < caminhao.x + caminhao.w && b.x + b.w > caminhao.x &&
                  b.y + b.h > caminhao.y && b.y < caminhao.y + caminhao.h;
    if (pegou) {                       // caixa pega: +1 ponto
      pontos++;
      caixas.splice(i, 1);
    } else if (b.y > A - 20) {         // caixa no chão: perde 1 vida
      vidas--;
      caixas.splice(i, 1);
    }
  }

  // Fim de jogo
  if (vidas <= 0) {
    estado = "fim";
    if (pontos > recorde) {
      recorde = pontos;
      try { localStorage.setItem("pegaCaixaRecorde", recorde); } catch (e) {}
    }
  }
}

// ---------- Desenho ----------
function desenhar() {
  // Fundo e chão
  c.fillStyle = "#cfd3d6"; c.fillRect(0, 0, L, A);
  c.fillStyle = "#8a8f94"; c.fillRect(0, A - 20, L, 20);
  c.fillStyle = "#f5b800";                              // faixa amarela de segurança
  for (let x = 0; x < L; x += 40) c.fillRect(x, A - 14, 20, 8);

  if (estado === "inicio") { texto("PEGA CAIXA", 250, 40); texto("Toque para jogar", 300, 20); return; }

  // Caixas
  for (const b of caixas) {
    c.fillStyle = "#b5793a"; c.fillRect(b.x, b.y, b.w, b.h);
    c.strokeStyle = "#6e4519"; c.lineWidth = 3; c.strokeRect(b.x, b.y, b.w, b.h);
    c.fillStyle = "#6e4519"; c.fillRect(b.x + b.w / 2 - 2, b.y, 4, b.h); // fita da caixa
  }

  // Caminhão: carroceria, cabine e rodas
  const t = caminhao;
  c.fillStyle = "#f5b800"; c.fillRect(t.x, t.y, t.w * 0.65, t.h - 10);
  c.fillStyle = "#d9534f"; c.fillRect(t.x + t.w * 0.65, t.y + 15, t.w * 0.35, t.h - 25);
  c.fillStyle = "#222";
  c.beginPath(); c.arc(t.x + 18, t.y + t.h - 8, 9, 0, 7); c.fill();
  c.beginPath(); c.arc(t.x + t.w - 16, t.y + t.h - 8, 9, 0, 7); c.fill();

  // Pontos e vidas no topo
  c.textAlign = "left"; c.fillStyle = "#000"; c.font = "bold 22px Arial";
  c.fillText("Pontos: " + pontos, 12, 30);
  c.textAlign = "right"; c.fillText("Vidas: " + "❤".repeat(Math.max(vidas, 0)), L - 12, 30);

  if (estado === "fim") {
    c.fillStyle = "rgba(0,0,0,0.7)"; c.fillRect(0, 200, L, 220);
    c.fillStyle = "#fff";
    texto("Fim de jogo", 260, 36, "#fff");
    texto("Pontos: " + pontos, 305, 24, "#fff");
    texto("Recorde: " + recorde, 340, 24, "#fff");
    texto("Aperte Recomeçar", 390, 18, "#f5b800");
  }
}

// Escreve um texto centralizado
function texto(t, y, tamanho, cor) {
  c.textAlign = "center"; c.fillStyle = cor || "#000";
  c.font = "bold " + tamanho + "px Arial"; c.fillText(t, L / 2, y);
}

// Repete tudo ~60 vezes por segundo
function loop() { atualizar(); desenhar(); requestAnimationFrame(loop); }

estado = "inicio";
loop();
</script>
</body>
</html>
